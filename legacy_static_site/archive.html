<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章归档 | 我的个人主页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .archive-item:hover h3 {
            color: #4f46e5;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">

    <!-- 极简导航 -->
    <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="index.html" class="font-bold text-lg tracking-tight hover:text-indigo-600 transition-colors">Blog</a>
            <div class="flex items-center gap-6">
                <div class="hidden md:flex gap-6 text-sm font-medium text-slate-600 dark:text-slate-400">
                    <a href="index.html" class="hover:text-indigo-600 transition-colors">首页</a>
                    <a href="posts.html" class="hover:text-indigo-600 transition-colors">所有文章</a>
                    <a href="archive.html" class="text-indigo-600 font-bold transition-colors">归档</a>
                    <a href="about.html" class="hover:text-indigo-600 transition-colors">关于</a>
                </div>
                <!-- 暗黑模式切换 -->
                <button id="dark-mode-toggle" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-500 dark:text-slate-400">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-20 animate-fade-in-up">
        <h1 class="text-4xl font-bold mb-12">文章归档</h1>
        
        <div class="space-y-16">
            <!-- 2026 -->
            <div>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-8 border-b border-slate-200 dark:border-slate-800 pb-2">2026</h2>
                <div class="space-y-6">
                    <a href="#" class="archive-item flex items-center gap-4 transition-colors">
                        <span class="text-sm text-slate-400 font-mono">03-19</span>
                        <h3 class="text-lg font-medium">现代 Web 开发中的静态网站生成技术</h3>
                    </a>
                    <a href="#" class="archive-item flex items-center gap-4 transition-colors">
                        <span class="text-sm text-slate-400 font-mono">03-10</span>
                        <h3 class="text-lg font-medium">流水账 Week 12 - 摄影与生活中的光影</h3>
                    </a>
                </div>
            </div>

            <!-- 2025 -->
            <div>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-8 border-b border-slate-200 dark:border-slate-800 pb-2">2025</h2>
                <div class="space-y-6">
                    <a href="#" class="archive-item flex items-center gap-4 transition-colors">
                        <span class="text-sm text-slate-400 font-mono">12-25</span>
                        <h3 class="text-lg font-medium">我的年度总结：从学生到开发者的转变</h3>
                    </a>
                    <a href="#" class="archive-item flex items-center gap-4 transition-colors">
                        <span class="text-sm text-slate-400 font-mono">11-05</span>
                        <h3 class="text-lg font-medium">浅谈量子力学的基础实验</h3>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 极简页脚 -->
    <footer class="py-16 border-t border-slate-200 dark:border-slate-800 text-center text-slate-400 text-[10px] uppercase tracking-widest">
        <p>© 2026 张三. Crafted with <i class="fa-solid fa-heart text-red-400"></i> & Tailwind CSS.</p>
    </footer>

    <script>
        // 暗黑模式切换
        const toggleBtn = document.getElementById('dark-mode-toggle');
        const html = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }
        toggleBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });
    </script>
</body>
</html>
