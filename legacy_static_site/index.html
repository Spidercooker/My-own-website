<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页 | 探索与记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">

    <!-- 极简导航 -->
    <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="#" class="font-bold text-lg tracking-tight hover:text-indigo-600 transition-colors">Blog</a>
            <div class="flex items-center gap-6">
                <div class="hidden md:flex gap-6 text-sm font-medium text-slate-600 dark:text-slate-400">
                    <a href="index.html" class="text-indigo-600 font-bold transition-colors">首页</a>
                    <a href="posts.html" class="hover:text-indigo-600 transition-colors">文章</a>
                    <a href="about.html" class="hover:text-indigo-600 transition-colors">关于</a>
                </div>
                <!-- 暗黑模式切换 -->
                <button id="dark-mode-toggle" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-500 dark:text-slate-400">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 头部标题 -->
    <header class="py-24 text-center animate-fade-in-up">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">我的个人主页</h1>
        <p class="text-slate-500 dark:text-slate-400 text-lg h-8">
            <span id="typewriter"></span><span class="animate-pulse border-r-2 border-indigo-500 ml-1"></span>
        </p>
    </header>

    <main class="max-w-5xl mx-auto px-6 pb-20">
        <div class="flex flex-col md:flex-row gap-12">
            
            <!-- 文章列表区域 (左侧) -->
            <div class="flex-1 space-y-12">
                
                <div class="reveal py-20 text-center border border-dashed border-slate-200 dark:border-slate-800 rounded-3xl bg-white/50 dark:bg-slate-800/50 shadow-sm">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-700 mb-6">
                        <i class="fa-regular fa-folder-open text-3xl text-slate-400"></i>
                    </div>
                    <p class="text-slate-500 dark:text-slate-400 font-medium">文章正在准备中，敬请期待...</p>
                    <p class="text-slate-400 dark:text-slate-500 text-xs mt-2 italic">Coming soon</p>
                </div>

            </div>

            <!-- 侧边栏 (右侧) -->
            <aside class="w-full md:w-64 space-y-12 reveal">
                
                <!-- 个人信息 -->
                <section class="text-center md:text-left group">
                    <div class="relative inline-block md:block mb-6">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=200&q=80" alt="Avatar" class="w-24 h-24 rounded-3xl mx-auto md:mx-0 object-cover grayscale group-hover:grayscale-0 transition-all duration-500 shadow-xl group-hover:rotate-3">
                        <div class="absolute -bottom-2 -right-2 w-6 h-6 bg-green-500 border-4 border-slate-50 dark:border-slate-900 rounded-full"></div>
                    </div>
                    <h3 class="text-xl font-bold mb-1">小千 (Xiao Qian)</h3>
                    <p class="text-slate-500 dark:text-slate-400 text-xs mb-4">动画爱好者</p>
                    <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed mb-6">
                        这是我的个人空间。在这里分享日常生活与思考。
                    </p>
                    <div class="flex justify-center md:justify-start gap-5 text-slate-400 dark:text-slate-500">
                        <a href="#" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors text-xl"><i class="fa-brands fa-github"></i></a>
                        <a href="#" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors text-xl"><i class="fa-brands fa-twitter"></i></a>
                        <a href="#" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors text-xl"><i class="fa-solid fa-envelope"></i></a>
                        <a href="#" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors text-xl"><i class="fa-solid fa-rss"></i></a>
                    </div>
                </section>

                <!-- 统计数据 -->
                <section class="grid grid-cols-2 gap-4 border-y border-slate-200 dark:border-slate-800 py-8 text-center bg-white/30 dark:bg-slate-800/30 rounded-2xl md:bg-transparent md:rounded-none md:border-x-0">
                    <a href="posts.html" class="group transition-colors">
                        <div class="text-xl font-bold group-hover:text-indigo-600">54</div>
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">文章</div>
                    </a>
                    <a href="#tags" class="group transition-colors">
                        <div class="text-xl font-bold group-hover:text-indigo-600">21</div>
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">标签</div>
                    </a>
                </section>

                <!-- 标签 -->
                <section id="tags">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-tags text-[10px]"></i> 标签
                    </h4>
                    <div class="flex flex-wrap gap-2">
                        <span class="px-3 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-400 rounded-full">#游戏</span>
                        <span class="px-3 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-400 rounded-full">#动画</span>
                        <span class="px-3 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-400 rounded-full">#摄影</span>
                    </div>
                </section>

                <!-- 位置 -->
                <section id="about" class="pt-4">
                    <p class="text-xs text-slate-400 flex items-center gap-2 italic">
                        <i class="fa-solid fa-location-dot animate-bounce text-indigo-500"></i>
                        <span id="user-location">正在识别您的位置...</span>
                    </p>
                </section>
            </aside>

        </div>
    </main>

    <!-- 返回顶部按钮 -->
    <button id="back-to-top" class="fixed bottom-8 right-8 w-12 h-12 bg-indigo-600 text-white rounded-full shadow-2xl flex items-center justify-center opacity-0 translate-y-10 transition-all duration-300 hover:bg-indigo-700 active:scale-90 z-40">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- 极简页脚 -->
    <footer class="py-16 border-t border-slate-200 dark:border-slate-800 text-center text-slate-400 text-[10px] uppercase tracking-widest">
        <p>© 2026 张三. Crafted with <i class="fa-solid fa-heart text-red-400"></i> & Tailwind CSS.</p>
    </footer>

    <script>
        // 1. 暗黑模式切换
        const toggleBtn = document.getElementById('dark-mode-toggle');
        const html = document.documentElement;
        
        // 检查本地存储
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }

        toggleBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

        // 2. 打字机效果
        const text = "记录技术、物理与生活的点滴";
        const typewriterElement = document.getElementById('typewriter');
        let index = 0;

        function type() {
            if (index < text.length) {
                typewriterElement.textContent += text.charAt(index);
                index++;
                setTimeout(type, 150);
            }
        }
        setTimeout(type, 1000); // 延迟开始

        // 3. 滚动显示动画 (Scroll Reveal)
        const revealElements = document.querySelectorAll('.reveal');
        const revealOnScroll = () => {
            const windowHeight = window.innerHeight;
            revealElements.forEach(el => {
                const elementTop = el.getBoundingClientRect().top;
                if (elementTop < windowHeight - 50) {
                    el.classList.add('active');
                }
            });
        };
        window.addEventListener('scroll', revealOnScroll);
        revealOnScroll(); // 初始化

        // 4. 返回顶部按钮逻辑
        const backToTopBtn = document.getElementById('back-to-top');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.remove('opacity-0', 'translate-y-10');
            } else {
                backToTopBtn.classList.add('opacity-0', 'translate-y-10');
            }
        });
        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 5. IP 地理位置识别
        async function fetchLocation() {
            const locationElement = document.getElementById('user-location');
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                if (data.city && data.country_name) {
                    locationElement.textContent = `${data.city}, ${data.country_name}`;
                } else {
                    locationElement.textContent = "北京, 中国"; // 回退方案
                }
            } catch (error) {
                console.error('Error fetching location:', error);
                locationElement.textContent = "北京, 中国"; // 回退方案
            }
        }
        fetchLocation();
    </script>
</body>
</html>
